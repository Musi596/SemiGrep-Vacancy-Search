{% extends 'core/base.html' %}
{% block title %}Профиль — SemiGrep{% endblock %}
{% block content %}
<section class="form-layout">
  <div class="page-heading"><div class="eyebrow"><span class="live-dot"></span> ВАШ ПРОФИЛЬ</div><h1>Расскажите о <span>себе</span></h1><p>Эти данные помогут работодателям узнать вас лучше.</p></div>
  <form method="post" class="surface-form">
    {% csrf_token %}<div class="form-row"><div><label for="first_name">Имя</label><input id="first_name" name="first_name" autocomplete="given-name" value="{{ user.first_name }}"></div><div><label for="last_name">Фамилия</label><input id="last_name" name="last_name" autocomplete="family-name" value="{{ user.last_name }}"></div></div>
    <label for="email">Электронная почта</label><input id="email" name="email" type="email" autocomplete="email" value="{{ user.email }}" placeholder="name@example.com">
    <div class="form-actions"><span></span><button class="button button-lime" type="submit">Сохранить профиль <span>↗</span></button></div>
  </form>
</section>
{% endblock %}
